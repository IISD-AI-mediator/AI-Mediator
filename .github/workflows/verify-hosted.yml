name: Check the published travel app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: verify-hosted-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployed main commit from outside Render
        shell: python
        run: |
          import json, os, time
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          origin = 'https://iisd-travel-mediator-bogc.onrender.com'
          version = Path('VERSION').read_text().strip()
          expected = {'status': 'ok', 'version': version, 'revision': os.environ['GITHUB_SHA']}
          deadline = time.monotonic() + 560
          health = None
          while time.monotonic() < deadline:
              try:
                  with urlopen(origin + '/healthz', timeout=65) as response:
                      health = json.load(response)
                  if health == expected:
                      break
              except (HTTPError, URLError, TimeoutError):
                  pass
              time.sleep(10)
          assert health == expected, (health, expected)
          print('Health, database and release commit:', health)
          for endpoint, marker in [('/', '동행'), ('/static/app.js', 'import'), ('/static/style.css', '{')]:
              with urlopen(origin + endpoint, timeout=30) as response:
                  assert response.status == 200 and marker in response.read().decode(), endpoint
              print('Public route OK:', endpoint)
          try:
              req = Request(origin + '/api/rooms', data=b'{}', headers={'Content-Type': 'application/json'})
              urlopen(req, timeout=30)
              raise AssertionError('An empty create request unexpectedly succeeded')
          except HTTPError as error:
              assert error.code == 400 and json.load(error).get('field') == 'request_id'
          print('Public room creation reached input validation')
