<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 852" width="1100" height="852" role="img" aria-labelledby="title description" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><title id="title">동행 여행 조율 · LangGraph 실행 그래프</title><desc id="description">실행 중 사용하는 세 컴파일 그래프의 노드와 연결을 읽어 표시했다. 하단 표는 협상 그래프의 재진입 및 반환 경로다.</desc><defs><marker id="arrow" viewBox="0 0 9 9" refX="7" refY="4.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 8 4.5 L 0 9 z" fill="#525e57" /></marker></defs><rect x="0" y="0" width="1100" height="852" rx="0" fill="#f6f7f5" stroke="none" /><text x="26" y="39" font-size="14" font-weight="700" fill="#536359" text-anchor="start">AI–MEDIATOR  /  LANGGRAPH</text><text x="26" y="79" font-size="33" font-weight="750" fill="#222725" text-anchor="start">동행의 여행 조율 과정</text><text x="1080" y="81" font-size="14" font-weight="500" fill="#526059" text-anchor="end">실선 · 기본 연결   /   점선 · 조건 분기</text><g data-graph="travel_negotiation"><rect x="22" y="122" width="423" height="482" rx="12" fill="white" stroke="#d4d8d5" /><text x="42" y="155" font-size="20" font-weight="700" fill="#222725" text-anchor="start">방의 협상 단계</text><text x="42" y="181" font-size="13" font-weight="400" fill="#526059" text-anchor="start">합의 여부와 발언 순서에 따라 다음 단계로 이동한다.</text><path d="M 231.82000000000002 477 C 268.82000000000005 453, 268.82000000000005 513, 233.82000000000002 490" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)" data-source="floor" data-target="floor"><title>floor → floor</title></path><path d="M 99.82000000000002 483 Q 78.82000000000002 483, 78.82000000000002 473 L 78.82000000000002 365 Q 78.82000000000002 355, 97.82000000000002 355" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)" data-source="floor" data-target="judge"><title>floor → judge</title></path><path d="M 165.82000000000002 503 L 165.82000000000002 524" fill=