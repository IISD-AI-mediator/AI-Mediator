</g><g data-node="propose"><rect x="99.82000000000002" y="271" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="165.82000000000002" y="290" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">제안 작성</text><text x="165.82000000000002" y="304" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">propose</text></g><g data-node="judge"><rect x="99.82000000000002" y="335" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="165.82000000000002" y="354" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">결정자 · 중재</text><text x="165.82000000000002" y="368" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">judge</text></g><g data-node="open"><rect x="99.82000000000002" y="399" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="165.82000000000002" y="418" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">파이트 모드 열기</text><text x="165.82000000000002" y="432" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">open</text></g><g data-node="floor"><rect x="99.82000000000002" y="463" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="165.82000000000002" y="482" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">발언 순서·마감</text><text x="165.82000000000002" y="496" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">floor</text></g><g data-node="speak"><rect x="99.82000000000002" y="527" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="165.82000000000002" y="546" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">개인 발언</text><text x="165.82000000000002" y="560" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">speak</text></g><g data-node="final"><rect x="277.48" y="335" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="343.48" y="354" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">결과 확정</text><text x="343.48" y="368" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">final</text></g></g><g data-graph="parallel_agents"><rect x="458" y="122" width="305" height="482" rx="12" fill="white" stroke="#d4d8d5" /><text x="478" y="155" font-size="20" font-weight="700" fill="#222725" text-anchor="start">참가자별 병렬 처리</text><text x="478" y="181" font-size="13" font-weight="400" fill="#526059" text-anchor="start">정원만큼 독립된 에이전트에 작업을 배정한다.</text><path d="M 610.5 247 L 610.5 268" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)" data-source="__start__" data-target="personal_agent"><title>__start__ → personal_agent</title></path><path d="M 610.5 311 L 610.5 332" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="none" marker-end="url(#arrow)" data-source="personal_agent" data-target="__end__"><title>personal_agent → __end__</title></path><g data-node="__start__"><rect x="544.5" y="207" width="132" height="40" rx="8" fill="#eef1ee" stroke="#768078" /><text x="610.5" y="226" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">시작</text><text x="610.5" y="240" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">__start__</text></g><g data-node="personal_agent"><rect x="544.5" y="271" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="610.5" y="290" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">참가자별 에이전트</text><text x="610.5" y="304" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">personal_agent</text></g><g data-node="__end__"><rect x="544.5" y="335" width="132" height="40" rx="8" fill="#eef1ee" stroke="#768078" /><text x="610.5" y="354" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">실행 반환</text><text x="610.5" y="368" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">__end__</text></g></g><g data-graph="personal_agent"><rect x="776" y="122" width="302" height="482" rx="12" fill="white" stroke="#d4d8d5" /><text x="796" y="155" font-size="20" font-weight="700" fill="#222725" text-anchor="start">개인 에이전트</text><text x="796" y="181" font-size="13" font-weight="400" fill="#526059" text-anchor="start">필요한 검색 근거를 개인 제안에 반영한다.</text><path d="M 927.0 247 L 927.0 268" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="none" marker-end="url(#arrow)" data-source="__start__" data-target="interpret"><title>__start__ → interpret</title></path><path d="M 993.0 291 Q 1014.0 291, 1014.0 301 L 1014.0 409 Q 1014.0 419, 995.0 419" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)" data-source="interpret" data-target="propose"><title>interpret → propose</title></path><path d="M 927.0 311 L 927.0 332" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)" data-source="interpret" data-target="search"><title>interpret → search</title></path><path d="M 927.0 375 L 927.0 396" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="none" marker-end="url(#arrow)" data-source="search" data-target="propose"><title>search → propose</title></path><path d="M 927.0 439 L 927.0 460" fill="none" stroke="#525e57" stroke-width="1.8" stroke-dasharray="none" marker-end="url(#arrow)" data-source="propose" data-target="__end__"><title>propose → __end__</title></path><g data-node="__start__"><rect x="861.0" y="207" width="132" height="40" rx="8" fill="#eef1ee" stroke="#768078" /><text x="927.0" y="226" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">시작</text><text x="927.0" y="240" font-size="10" font-weight="400" fill="#59655d" text-anchor="middle">__start__</text></g><g data-node="interpret"><rect x="861.0" y="271" width="132" height="40" rx="8" fill="white" stroke="#768078" /><text x="927.0" y="290" font-size="13" font-weight="650" fill="#222725" text-anchor="middle">개인 조건 해석</text><text x="927.0" y="304"